{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}SubTrack{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'vendor/tabler/css/tabler.css' %}">
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="page">
       {% include 'includes/navbar.html' %}
        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const themeButton = document.getElementById('theme-toggle');
        const currencySelect = document.getElementById('currency-select');

        let savedTheme = localStorage.getItem('subtrack-theme') || 'light';
        applyTheme(savedTheme);

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);

            if (themeButton) {
                if (theme === 'dark') {
                    themeButton.innerHTML = '<i class="ti ti-sun"></i> Тема';
                } else {
                    themeButton.innerHTML = '<i class="ti ti-moon"></i> Тема';
                }
            }
        }

        if (themeButton) {
            themeButton.addEventListener('click', function () {
                savedTheme = savedTheme === 'light' ? 'dark' : 'light';

                localStorage.setItem('subtrack-theme', savedTheme);
                applyTheme(savedTheme);
            });
        }

        if (currencySelect) {
            const savedCurrency =
                localStorage.getItem('subtrack-currency') || 'RUB';

            currencySelect.value = savedCurrency;

            function updatePrices() {
                const currency = currencySelect.value;

                // Учебные коэффициенты для демонстрации конвертации
                const rates = {
                    RUB: 1,
                    USD: 1 / 81.9739,
                    EUR: 1 / 91.9337
                };

                const symbols = {
                    RUB: '₽',
                    USD: '$',
                    EUR: '€'
                };

                document.querySelectorAll('[data-price-rub]').forEach(function (element) {
                    const rubPrice = Number(element.dataset.priceRub);

                    if (!Number.isFinite(rubPrice)) {
                        return;
                    }

                    const convertedPrice = rubPrice * rates[currency];

                    element.textContent =
                        convertedPrice.toLocaleString('ru-RU', {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 2
                        }) + ' ' + symbols[currency];
                });
            }

            currencySelect.addEventListener('change', function () {
                localStorage.setItem('subtrack-currency', currencySelect.value);
                updatePrices();
            });

            updatePrices();
        }
    });
    </script>


    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleButton = document.querySelector('.navbar-toggler');
        const menu = document.getElementById('main-navbar');

        if (!toggleButton || !menu) return;

        toggleButton.addEventListener('click', function () {
            const isOpen = menu.classList.toggle('show');
            toggleButton.setAttribute('aria-expanded', isOpen);
        });

        menu.querySelectorAll('.nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
                menu.classList.remove('show');
                toggleButton.setAttribute('aria-expanded', 'false');
            });
        });
    });
    </script>

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/tabler/js/tabler.min.js' %}"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
