
{% extends 'base.html' %}

{% block title %}Вход — SubTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h1 class="h2 mb-4">Вход в SubTrack</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверный логин или пароль.
                        Проверь введённые данные.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="id_username">
                            Логин
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="form-control"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="id_password">
                            Пароль
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Войти
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
